route:
  receiver: 'chat'
  group_by: ['alertname', 'service']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="P1"
      receiver: 'pager'
    - matchers:
        - severity=~"P2|P3"
      receiver: 'chat'

inhibit_rules:
  - source_matchers:
      - severity="P1"
    target_matchers:
      - severity=~"P2|P3"
    equal: ['service']

receivers:
  - name: 'pager'
    webhook_configs:
      - url: 'http://pager:8080/hook/pager'
  - name: 'chat'
    webhook_configs:
      - url: 'http://pager:8080/hook/chat'